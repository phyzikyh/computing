project:
  type: book
  output-dir: _book

lang: ko

book:
  title: "컴퓨팅적사고와논리적문제해결"
  author: "신기홍"

  sidebar:
    search: true

  chapters:
    - index.qmd
    - part: "1주차 · 컴퓨팅 사고와 디지털 문제해결"
      chapters:
        - week01-lecture.qmd
        - week01-quiz.qmd
        - week01-lab.qmd
    - part: "2주차 · 문제 분해와 패턴 인식"
      chapters:
        - week02-lecture.qmd
        - week02-quiz.qmd
        - week02-lab.qmd
    - part: "3주차 · 추상화와 알고리즘 표현"
      chapters:
        - week03-lecture.qmd
        - week03-quiz.qmd
        - week03-lab.qmd
    - part: "4주차 · 변수와 연산자"
      chapters:
        - week04-lecture.qmd
        - week04-quiz.qmd
        - week04-lab.qmd
    - part: "5주차 · 선택 구조와 조건문"
      chapters:
        - week05-lecture.qmd
        - week05-quiz.qmd
        - week05-lab.qmd
    - part: "6주차 · 반복 구조와 자동화"
      chapters:
        - week06-lecture.qmd
        - week06-quiz.qmd
        - week06-lab.qmd
    - part: "7주차 · 복합 자료구조"
      chapters:
        - week07-lecture.qmd
        - week07-quiz.qmd
        - week07-lab.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: styles.css
    include-in-header:
      text: |
        <meta name="robots" content="noindex, nofollow">
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    code-fold: false
    code-tools: false
    highlight-style: github
    fig-align: center

mermaid:
  theme: default

execute:
  echo: false
  eval: true
  warning: false

editor: visual
