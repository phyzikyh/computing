<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>컴퓨팅적 사고와 논리적 문제해결</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .hub-card {
      background: #ffffff;
      padding: 3rem 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }
    h1 {
      font-size: 1.6rem;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }
    p {
      color: #64748b;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .btn {
      display: block;
      padding: 1rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      transition: all 0.2s;
    }
    .btn-student {
      background-color: #1AB18B;
      color: #ffffff;
    }
    .btn-student:hover {
      background-color: #158f70;
    }
    .btn-professor {
      background-color: #0f172a;
      color: #ffffff;
    }
    .btn-professor:hover {
      background-color: #1e293b;
    }
    .slide-links {
      margin-top: 1.5rem;
      font-size: 0.88rem;
      color: #94a3b8;
    }
    .slide-links a {
      color: #1AB18B;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="hub-card">
    <h1>컴퓨팅적 사고와 논리적 문제해결</h1>
    <p>2026년도 강의 전자교재 및 강의자료 포털</p>
    <div class="btn-group">
      <a href="./student/" class="btn btn-student">🧑‍🎓 학생용 전자교재 바로가기</a>
      <a href="./professor/" class="btn btn-professor">👨‍🏫 교수용 전자교재 바로가기</a>
    </div>
    <div class="slide-links">
      💡 1주차 슬라이드: <a href="./student/week01-slide.html">학생용</a> | <a href="./professor/week01-slide.html">교수용</a>
    </div>
  </div>
</body>
</html>
