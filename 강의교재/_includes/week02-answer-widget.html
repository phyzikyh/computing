<style>

.answer-row { display: flex; gap: .6rem; max-width: 560px; }
.answer-row input { flex: 1; min-width: 0; padding: .7rem .85rem; border: 1px solid #aab6c5; border-radius: 8px; }
.answer-row button { padding: .7rem 1rem; border: 0; border-radius: 8px; background: #2563eb; color: white; font-weight: 700; }
#week02-answer-message { min-height: 1.5rem; margin-top: .7rem; color: #c62828; }
#week02-answer-content { display: none; margin-top: 2rem; padding-top: 1rem; border-top: 2px solid #2563eb; }

@media (max-width: 560px) { .answer-row { flex-direction: column; } }
</style>

  async function openAnswer() {
    message.textContent = "확인 중입니다.";
    button.disabled = true;
    try {
      const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(input.value), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(payload.salt), iterations: 250000, hash: "SHA-256" }, material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

      content.style.display = "block";
      document.getElementById("week02-answer-lock").style.display = "none";

      button.disabled = false;
