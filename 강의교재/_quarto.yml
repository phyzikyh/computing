format:
  live-html:
    theme: cosmo
    css: styles.css
    lang: ko
    toc: true
    toc-title: "목차"
    toc-depth: 3
    number-sections: true
    number-depth: 2
    code-fold: false
    code-tools: false
    highlight-style: github
    fig-align: center
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">

mermaid:
  theme: default

execute:
  echo: false
  eval: true
  warning: false

editor: source
